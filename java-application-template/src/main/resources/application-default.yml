# ---------------------------------------------------------------------------
# DEFAULT CONFIGURATION
# ---------------------------------------------------------------------------

spring:
  datasource:
    url: jdbc:h2:file:${DATA_DIR:./data}/taskdb;AUTO_SERVER=FALSE
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate  
    show-sql: false

  flyway:
    enabled: true

  h2:
    console:
      enabled: false   

server:
  port: ${SERVER_PORT:8080}

management:
  endpoint:
    health:
      show-details: never
      
