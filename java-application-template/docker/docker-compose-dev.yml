# Usage:
#   docker compose -f docker/docker-compose-dev.yml run --rm build    # builds the jar via Maven
#   docker compose -f docker/docker-compose-dev.yml up --build app   # builds the image and starts the app
services:
  build:
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /build
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      MAVEN_CONFIG: /build/.m2-repo
    volumes:
      - ..:/build
      - ../.m2-repo:/build/.m2-repo
    command: >
      bash -c "
        mvn -B -e -Dmaven.repo.local=/build/.m2-repo clean package
      "

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: java-application-template:latest
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DATA_DIR: /app/data
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - ${LOGS_DIR:-../logs}:/app/logs
      - ${DATA_DIR_HOST:-../data}:/app/data
      
