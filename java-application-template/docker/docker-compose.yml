# Usage: docker compose up -d
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: java-application-template:latest
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DATA_DIR: /app/data
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
      
